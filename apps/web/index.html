<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      El modo oscuro, sin destello (E3, docs/visual.md §3.3, D-00i y 3-h): un guion clásico, antes de la hoja
      de estilos y de todo lo demás, pone data-theme si el jugador lo eligió en este aparato. En un fichero y
      no en línea, porque la CSP solo deja script-src 'self'; en assets/ y con la huella de su contenido en el
      nombre, para que se sirva inmutable y no cueste un viaje en cada carga.
    -->
    <script src="/assets/theme-12588923.js"></script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      El marco (E3, docs/visual.md §12.4; PR 11): con viewport-fit=cover, env(safe-area-inset-*) vale algo
      en WebKit y el hueco de la barra de abajo sirve en un iPhone con la barra de inicio; theme-color,
      el navy de la cabecera, para la barra del navegador en Android.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#123a5c" />
    <title>Cycling Star</title>
    <!--
      La imagen de compartir (E3, docs/visual.md §14.7; PR 20): lo que se ve al compartir el enlace de una
      etapa. La pinta scripts/og-image.mjs, y generados.test.ts mira que está al día.
    -->
    <meta property="og:image" content="/og-default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <!--
      /health sale con el HTML (E2, paso 10b; docs/retransmision.md §18.5): toda página lo pide al montar,
      y con él los interruptores de los que cuelga el resto de la carga. El fetch de la web es same-origin,
      así que la precarga es crossorigin anónima: con otro modo de credenciales el navegador no la casa.
    -->
    <link rel="preload" href="/health" as="fetch" crossorigin="anonymous" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
