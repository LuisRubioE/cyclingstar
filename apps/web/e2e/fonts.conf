<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  LA LETRA DE LA PRUEBA DEL TELÉFONO (E3, docs/visual.md §7.6; decisión 7-k). Con la letra cambia lo que
  parte de línea y lo que se sale, y con ello cinco de las diez comprobaciones: un cambio de la imagen del
  ejecutor movería la línea base sin tocar la web. Así que la prueba fija la suya, por `FONTCONFIG_FILE`,
  en el trabajo `Teléfono` y en el de cada noche: de todas las letras del sistema, Chromium solo ve los seis
  ficheros de `fonts-dejavu-core`, estén en la carpeta que estén, y `system-ui` y las familias genéricas son
  las de DejaVu.

  No basta con un alias de `system-ui` y `sans-serif`. La pila de hoy no empieza por `system-ui` sino por
  `-apple-system` y pasa por `Arial` antes de `sans-serif`, y fontconfig da a `Arial` la Liberation Sans,
  la de sus mismas medidas, si la imagen la trae. Medido con Chromium 141 y `CSS.getPlatformFontsForNode`
  en el contenedor de diseño: sin este fichero, Inter; con solo el alias, Liberation Sans; con este,
  DejaVu Sans, con la pila de hoy, con la de §3.4 y con `Inter` pedida por su nombre.

  Dos cosas que se aprendieron al escribirlo. La lista blanca va por nombre de fichero (`glob`) y no por
  familia (`pattern`): fontconfig descarta primero por fichero y solo después mira las familias, así que
  con `*.ttf` rechazado una familia aceptada ya no llega. Y la carpeta no se fija: una primera versión que solo
  miraba `/usr/share/fonts/truetype/dejavu` dio, en el Ubuntu del CI, DejaVu Math TeX Gyre para
  `system-ui`, y la prueba no puede depender de dónde ponga cada imagen los ficheros. Las herramientas de fontconfig (`fc-list`, `fc-match`) no aplican estas listas a
  las fuentes ya cacheadas del sistema y Chromium sí: lo que manda es la letra que lee la prueba por CDP.
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <selectfont>
    <rejectfont>
      <glob>*.ttf</glob>
      <glob>*.TTF</glob>
      <glob>*.otf</glob>
      <glob>*.OTF</glob>
      <glob>*.ttc</glob>
      <glob>*.otc</glob>
      <glob>*.pfb</glob>
      <glob>*.pfa</glob>
      <glob>*.pcf</glob>
      <glob>*.pcf.gz</glob>
      <glob>*.bdf</glob>
      <glob>*.woff</glob>
      <glob>*.woff2</glob>
      <glob>*.t1</glob>
      <glob>*.dfont</glob>
    </rejectfont>
    <acceptfont>
      <glob>*/DejaVuSans.ttf</glob>
      <glob>*/DejaVuSans-Bold.ttf</glob>
      <glob>*/DejaVuSansMono.ttf</glob>
      <glob>*/DejaVuSansMono-Bold.ttf</glob>
      <glob>*/DejaVuSerif.ttf</glob>
      <glob>*/DejaVuSerif-Bold.ttf</glob>
    </acceptfont>
  </selectfont>
  <alias binding="strong">
    <family>system-ui</family>
    <prefer><family>DejaVu Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>DejaVu Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>serif</family>
    <prefer><family>DejaVu Serif</family></prefer>
  </alias>
  <alias binding="strong">
    <family>monospace</family>
    <prefer><family>DejaVu Sans Mono</family></prefer>
  </alias>
</fontconfig>
