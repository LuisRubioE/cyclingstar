<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  LA LETRA DE LA PRUEBA DEL TELÉFONO (E3, docs/visual.md §7.6; decisión 7-k). Con la letra cambia lo que
  parte de línea y lo que se sale, y con ello cinco de las diez comprobaciones: un cambio de la imagen del
  ejecutor movería la línea base sin tocar la web. Así que la prueba fija la suya, por `FONTCONFIG_FILE`,
  en el trabajo `Teléfono` y en el de cada noche: este fichero no incluye la configuración del sistema y
  solo ve las tres letras de `fonts-dejavu-core`, con las familias genéricas y `system-ui` en ellas.

  No basta con un alias de `system-ui` y `sans-serif` sobre la configuración del sistema. La pila de hoy
  no empieza por `system-ui` sino por `-apple-system` y pasa por `Arial` antes de `sans-serif`, y
  fontconfig da a `Arial` la Liberation Sans, la de sus mismas medidas, si la imagen la trae. Medido con
  Chromium 141 y `CSS.getPlatformFontsForNode` en el contenedor de diseño: sin este fichero, Inter; con
  solo el alias, Liberation Sans; con este, DejaVu Sans, con la pila de hoy y con la de §3.4.
-->
<fontconfig>
  <dir>/usr/share/fonts/truetype/dejavu</dir>
  <cachedir prefix="xdg">fontconfig-telefono</cachedir>
  <alias binding="strong">
    <family>system-ui</family>
    <prefer><family>DejaVu Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>DejaVu Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>serif</family>
    <prefer><family>DejaVu Serif</family></prefer>
  </alias>
  <alias binding="strong">
    <family>monospace</family>
    <prefer><family>DejaVu Sans Mono</family></prefer>
  </alias>
</fontconfig>
