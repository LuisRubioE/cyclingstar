name: Setup del monorepo
description: Instala pnpm, Node (versión de .nvmrc) con caché del store y las dependencias.

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install
      shell: bash
      run: pnpm install --frozen-lockfile
