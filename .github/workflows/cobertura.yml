name: Cobertura y auditoría

# LAS DOS SEÑALES QUE NO SON DE COMMIT.
#
# El CI de cada push contesta una pregunta: «¿pasa la suite con este cambio?». Estas dos no dependen
# del cambio: el porcentaje de cobertura se lee de vez en cuando para decidir dónde faltan pruebas, y
# una dependencia vulnerable no aparece porque alguien empuje código sino porque se publica un aviso.
# Correrlas en cada push era pagar minutos por una respuesta que nadie leía hasta el día siguiente.
#
# Esto se montó el día que el repositorio era PRIVADO y se agotaron los minutos de Actions: no falló
# una prueba, se quedó sin ARRANCAR el CI entero y con él el despliegue. Un push costaba 39 minutos
# facturables y 34 eran el job de tests; la instrumentación de la cobertura multiplica la suite por
# 1,76 (530 s contra 934 s en local).
#
# El repositorio es público desde el 14/08/2026 y los minutos ya no se pagan, pero esto se queda: la
# cobertura y la auditoría se leen una vez al día, no cincuenta, y sacarlas del push es lo que hace
# que el CI conteste en seis minutos en vez de en treinta y nueve.
#
# `workflow_dispatch` está a propósito: `ci.yml` no lo tiene, así que este es el único sitio desde el
# que se puede lanzar una pasada a mano sin empujar un commit.

on:
  schedule:
    # 04:15 UTC. La hora no es redonda a posta: las tareas programadas a en punto se agolpan en la
    # cola de GitHub y arrancan tarde.
    - cron: '15 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    name: Cobertura
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cyclingstar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cyclingstar_test
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # Mismo camino que el job de tests del CI: `packages/db` compilado y esquema aplicado, para que
      # la cobertura se mida sobre la misma suite y no sobre una versión mutilada de ella.
      - name: Build de packages/db
        run: pnpm exec tsc -b packages/db
      - name: Migraciones sobre la base de tests
        run: node scripts/migrate.mjs

      # Sin `CS_BANCOS`: los bancos de noche de E2 van en su propio job (`bancos`, abajo). Dentro de
      # la cobertura alargaron la pasada hasta 2 h 6 min y dos pruebas del motor agotaron sus 30 s
      # (4 de octubre de 2026).
      #
      # Y sin las puertas de tiempo de E2, que bajo la instrumentación no miden nada: B14
      # (`horizonLatency.test.ts`), B8 del fotograma (`clientCost.test.ts`), B8 de la voz
      # (`voicePrefix.test.ts`) y B8 del parse (`broadcastFixtures.test.ts`, con B6, B3, B13 y B16
      # rápida). Las cuatro corren en cada push y en cada PR en `ci.yml`, sin instrumentar, que es donde
      # un umbral en milisegundos significa algo. Del 4 al 8 de octubre de 2026 esta pasada cayó cada
      # noche por ellas (17 tests: medianas de 3,7 ms contra 3, fotogramas de 0,48 ms contra 0,25) y por
      # dos pruebas del motor que pasaron de 30 s (51 y 36 s); un rojo aquí cuelga del commit de `main`
      # de esa noche, y un redespliegue de ese commit en Railway, el de cambiar una variable, espera al
      # CI y se salta si lo encuentra rojo. Por la instrumentación (×1,75 a ×2,02) y el runner (+30 %),
      # el límite por test es aquí de 90 s y no de 30 (`vitest.config.ts`).
      - name: Test con cobertura
        run: >-
          pnpm test:coverage
          --exclude '**/node_modules/**'
          --exclude packages/db/src/horizonLatency.test.ts
          --exclude apps/web/src/domain/broadcast/clientCost.test.ts
          --exclude apps/api/src/voicePrefix.test.ts
          --exclude apps/api/src/broadcastFixtures.test.ts
          --testTimeout=90000

      - name: Sube el informe de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  # `CS_BANCOS=1` enciende lo que solo corre de noche (E2, docs/retransmision.md §16.4, 16-g y 16-n):
  # B10 largo (`packages/db/src/timelineCollector.long1.test.ts` y `long2`, las 22 etapas en línea
  # del banco por dos semillas) y que fallen B6 del JSON de la línea y las familias de B2 que no
  # llegan a su umbral (16-j), que en el tramo de un PR solo se imprimen
  # (`packages/engine/src/sim/timeline.test.ts`); y, desde el 11a, B16 largo (la radio desde la línea
  # contra la guardada en las 22 en línea del banco por dos semillas y las dos cronos,
  # `apps/api/src/broadcastFixtures.test.ts`, §17.14). En su propio runner y sin instrumentar, para no
  # robarle la CPU a la cobertura; un fallo aquí sigue siendo rojo.
  bancos:
    name: Bancos de noche (E2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Build de packages/db
        run: pnpm exec tsc -b packages/db
      - name: B10 largo, B6 del JSON y las familias de B2
        run: >-
          pnpm exec vitest run
          packages/db/src/timelineCollector.long1.test.ts
          packages/db/src/timelineCollector.long2.test.ts
          packages/engine/src/sim/timeline.test.ts
        env:
          CS_BANCOS: '1'
      - name: B16 largo, la radio desde la línea contra la guardada
        run: pnpm exec vitest run apps/api/src/broadcastFixtures.test.ts
        env:
          CS_BANCOS: '1'

  # LO QUE LA PRUEBA DEL TELÉFONO MIRA CADA NOCHE (E3, docs/visual.md §7.5 y §16.5; PR 2a): el
  # rendimiento con la red y la CPU de un teléfono en las cuatro páginas del mapa 05 §12, `Watch` con los
  # umbrales de E2, y desde el PR 2b la letra al doble y la pantalla de lado. Sobre el mismo mundo que el
  # trabajo `Teléfono` de `ci.yml`, de la caché.
  #
  # INFORMA Y NO PARA NADA (D-19): `continue-on-error`, como la auditoría. Un umbral roto pone el trabajo
  # en rojo y deja las cifras en el informe, pero no el flujo: un rojo de noche cuelga del commit de `main`
  # de esa noche, y Railway salta el redespliegue de un commit en rojo (lo cuenta la cabecera de la
  # cobertura, arriba). Los umbrales que la web de hoy aún no cumple van como `test.fixme`, con su cifra.
  telefono-noche:
    name: Teléfono de noche
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true
    env:
      FONTCONFIG_FILE: ${{ github.workspace }}/apps/web/e2e/fonts.conf
      E2E_BASE: http://localhost:3005
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Build
        run: pnpm build
      - uses: ./.github/actions/telefono
      - name: Las pasadas de la noche
        run: pnpm --filter @cyclingstar/web exec playwright test --project=nocturno
      - name: Sube el informe de la noche
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telefono-noche
          path: apps/web/e2e/.resultados/
          retention-days: 14
          if-no-files-found: ignore

  audit:
    name: Auditoría de dependencias (informativo)
    runs-on: ubuntu-latest
    # No bloquea nada: es una señal para revisar, no una puerta. Si se quiere bloquear algún día,
    # quitar `continue-on-error`.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: pnpm audit
        run: pnpm audit --audit-level=high
