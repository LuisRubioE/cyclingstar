name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Jobs independientes y en paralelo: antes era un único job secuencial y un fallo de
  # typecheck ocultaba lint, format, tests y build. Ahora cada señal es independiente.
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    # Postgres disponible para los tests que lo necesiten (integración de packages/db).
    # Los tests que no lo usan (motor, shared) simplemente ignoran DATABASE_URL, así que
    # el job funciona tanto si la suite es 100% en memoria/pglite como si es real.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cyclingstar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cyclingstar_test
      # LOS TESTS DE POSTGRES DE VERDAD (docs/retransmision.md §17.4 y 17-w; E2, paso 1a): los que
      # necesitan dos sesiones a la vez, que PGlite no tiene (`calendarConcurrency.test.ts` y los dos de
      # `migrations.test.ts` sobre la migración y el tick). Hasta el 1a ningún flujo daba esta variable
      # y se saltaban en todo PR. Va a una base propia, no a la de DATABASE_URL: `resetRealTestDb` vacía
      # su esquema entero, y `realTestDbFor` crea desde ella una base para cada fichero de tests.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cyclingstar_real
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Base de los tests de Postgres de verdad
        run: createdb cyclingstar_real
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres

      # packages/db compilado: lo necesita el aplicador de migraciones (dist/migrate.js).
      - name: Build de packages/db
        run: pnpm exec tsc -b packages/db

      # Deja el esquema listo por si hay tests de integración contra DATABASE_URL.
      # Si aún no existen, este paso simplemente valida que las migraciones aplican.
      - name: Migraciones sobre la base de tests
        run: node scripts/migrate.mjs

      # LA SUITE MENOS LOS BANCOS DE SIMULACIÓN, y sin cobertura. Las dos son decisiones de coste
      # MEDIDAS, no descuidos, y el reparto es tan desigual que sorprende:
      #
      #   packages/engine/src/sim/   3 ficheros    69 pruebas    536 s
      #   todo lo demás             95 ficheros  1.201 pruebas   102 s
      #
      # Tres ficheros de noventa y ocho se llevan el 84 % del tiempo por el 5 % de las pruebas,
      # porque no son pruebas: son BANCOS que corren cientos de etapas enteras. Y la instrumentación
      # de la cobertura multiplica además la suite por 1,76 (530 s contra 934 s en local).
      #
      # ESTE RECORTE NACIÓ POR DINERO Y SE QUEDA POR TIEMPO, y conviene dejarlo dicho para que nadie
      # lo deshaga pensando que ya no hace falta. Nació el día que el repositorio era PRIVADO y se
      # agotaron los minutos de Actions: no falló una prueba, se quedó sin ARRANCAR el CI entero —
      # seis jobs muertos en dos segundos, sin runner y sin logs— y con él el despliegue, que espera
      # a la señal verde. Un push costaba entonces 39 minutos facturables y 34 eran este job.
      #
      # El repositorio es público desde el 14/08/2026, así que los minutos ya no se pagan. La razón
      # de ahora es otra y es mejor: un CI que contesta en seis minutos se mira, y uno que tarda
      # treinta y nueve se ignora hasta el día siguiente. Los bancos siguen corriéndose enteros
      # cuando pueden romperse, que es lo único que había que garantizar.
      #
      # No se pierde nada: los bancos los corre el job `benches` de aquí abajo EN CUANTO SE TOCA EL
      # MOTOR, que es cuando pueden romperse, y `cobertura.yml` los corre enteros con cobertura una
      # vez al día pase lo que pase.
      # LAS PUERTAS DE LATENCIA se apartan de la suite y corren SOLAS y en serie, en el paso de abajo:
      # B14 (docs/retransmision.md §16.4 y 16-k, p95 ≤ 5 ms del horizonte contra el Postgres de
      # servicio) y B8 (16-m: p95 ≤ 0,25 ms del fotograma de `Watch`, y la mediana de `withGroupRoles`,
      # que vive en `voicePrefix.test.ts` con B19). Dentro de la suite las medía
      # con doscientos ficheros más compitiendo por la CPU: con el mismo `computeHorizon`, el p95 del
      # jugador dio 3,75, 5,05, 5,11 y 6,40 ms en cuatro corridas, y B8 dio 0,42 ms en la del 6a; eso
      # mide el runner, no el código. Los umbrales no cambian.
      - name: Test (sin los bancos)
        run: >-
          pnpm test:rapido
          --exclude packages/db/src/horizonLatency.test.ts
          --exclude apps/web/src/domain/broadcast/clientCost.test.ts
          --exclude apps/api/src/voicePrefix.test.ts

      - name: Las puertas de latencia (B14 y B8), solas
        run: >-
          pnpm exec vitest run --no-file-parallelism
          packages/db/src/horizonLatency.test.ts
          apps/web/src/domain/broadcast/clientCost.test.ts
          apps/api/src/voicePrefix.test.ts

  benches:
    name: Bancos · ${{ matrix.nombre }}
    runs-on: ubuntu-latest
    # Los bancos simulan cientos de etapas completas. Lo que vigilan es la FÍSICA, así que solo
    # pueden romperse cuando cambia el motor: en un push que toca la web, la API o un documento,
    # correrlos es pagar el rato por una respuesta que ya se sabe.
    #
    # Por eso el job existe siempre —así la comprobación aparece en la lista y nadie se cree que se
    # ha saltado en silencio— y lo que se salta es el trabajo. Cuando no hay base fiable con la que
    # comparar (un primer push a una rama, un `github.event.before` vacío) los bancos SE CORREN: ante
    # la duda, se paga el minuto y no se mira para otro lado.
    #
    # ————— Y SE REPARTEN EN SEIS, PORQUE ERA UNA COLA DE 71 MINUTOS (v83) —————
    #
    # MEDIDO fichero a fichero, en segundos de una corrida local (4.365 s en total, que es lo que
    # tarda el job entero en CI):
    #
    #   invariants.test.ts       2.798   64,1 %
    #   coherence.test.ts        1.197   27,4 %
    #   calendarQueens.test.ts     293    6,7 %
    #   world.test.ts               63    1,4 %
    #   raceRadio.test.ts           13    0,3 %
    #
    # Y tres `it` sueltos se llevaban el 40 % del job: «el mejor rematador gana bastantes» (740 s),
    # «el pelotón adelgaza entre un 12% y un 20% en tres semanas» (696 s) y «ninguna carrera de un
    # día satura con el pelotón fresco» (345 s).
    #
    # Dentro de un fichero vitest corre los tests EN SERIE, así que mientras `invariants` fuera uno
    # solo ningún runner extra podía ayudar: el suelo del job eran sus 47 minutos. Por eso el fichero
    # se partió (ver su cabecera) poniendo una de las tres pruebas caras en cada hermano.
    #
    # …Y EL PRIMER REPARTO SE QUEDÓ CORTO, QUE ES LO QUE EL CI ESTABA AHÍ PARA DECIR. Medidos los
    # seis tramos en una corrida real (run 35613047784):
    #
    #   invariantes      33,1 min   <- el cuello
    #   pequeñas         12,7 min
    #   abandonos        12,0 min
    #   coherencia       10,4 min
    #   clásicas          9,2 min
    #   mundo y radio     5,5 min
    #
    # O sea 71 -> 33, no los ~22 que yo había pronosticado con tiempos locales CON CONTENCIÓN (los
    # cuatro hermanos peleándose por cuatro núcleos). El pronóstico era malo y el dato es el bueno.
    #
    # Así que `invariants` se parte otra vez, en tres: el `desgaste` y el par llano+fases —que corren
    # sobre `flatScenario` con 300 y 120 semillas— salen a sus propios ficheros. La matriz pasa a
    # OCHO tramos. Y esta vez no se pone aquí ningún pronóstico de minutos: el número lo dirá la
    # siguiente corrida, tramo a tramo, que es de donde tenía que haber salido el anterior.
    #
    # LO QUE **NO** SE HACE, Y ES LA CONDICIÓN DURA: aquí no se salta NADA. La matriz no elige qué
    # bancos corren según lo que toca el cambio —eso sería adivinar qué banda puede moverse—, sino
    # que corre los mismos de siempre EN PARALELO. Si un cambio mueve una banda, la mueve igual y el
    # job entero sigue siendo condición para fusionar. Lo único que cambia es el reloj de pared.
    #
    # El precio, medido: la suma de los seis tramos fue de 82,8 min de runner contra los 71 de antes,
    # o sea un 17 % más, porque cada tramo paga su `setup` y su build. Se paga a gusto por el reloj.
    #
    # El reparto se afina con los tiempos que el propio CI imprime en cada tramo, y se ha afinado una
    # vez ya: ver el bloque de medidas de arriba.
    strategy:
      fail-fast: false
      matrix:
        include:
          - nombre: invariantes
            ficheros: packages/engine/src/sim/invariants.test.ts
          - nombre: llano y fases
            ficheros: packages/engine/src/sim/invariantsLlano.test.ts
          - nombre: desgaste
            ficheros: packages/engine/src/sim/invariantsDesgaste.test.ts
          - nombre: clásicas
            ficheros: packages/engine/src/sim/invariantsClasicas.test.ts
          - nombre: abandonos
            ficheros: packages/engine/src/sim/invariantsAbandonos.test.ts
          - nombre: pequeñas
            ficheros: packages/engine/src/sim/invariantsPequenas.test.ts
          - nombre: coherencia
            ficheros: packages/engine/src/sim/coherence.test.ts
          # `timeline.test.ts` (E2, paso 4b; docs/retransmision.md 15-d): el grabador de la línea
          # temporal sobre las 24 etapas del banco (B11, I1, I2, I3, I5, B2, B6 y B21). Vive en `sim/`,
          # que `test:rapido` excluye, así que si no estuviera aquí no correría en ningún PR.
          - nombre: mundo y radio
            ficheros: >-
              packages/engine/src/sim/calendarQueens.test.ts
              packages/engine/src/sim/world.test.ts
              packages/engine/src/sim/raceRadio.test.ts
              packages/engine/src/sim/routeCensus.test.ts
              packages/engine/src/sim/stageKind.completo.test.ts
              packages/engine/src/sim/frozenSkeletons.test.ts
              packages/engine/src/sim/preRegistro.test.ts
              packages/engine/src/sim/legacy/golden.test.ts
              packages/engine/src/sim/timeline.test.ts
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: ¿Ha cambiado el motor?
        id: motor
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo 'Sin base con la que comparar: se corren los bancos.'
            echo 'correr=si' >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE" "$HEAD" | grep -q '^packages/engine/'; then
            echo 'El motor cambia: se corren los bancos.'
            echo 'correr=si' >> "$GITHUB_OUTPUT"
          else
            echo 'El motor no cambia: los bancos se saltan (los corre cobertura.yml esta noche).'
            echo 'correr=no' >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/setup
        if: steps.motor.outputs.correr == 'si'
      # Los bancos importan `@cyclingstar/shared`, que resuelve a su `dist`: sin construir antes, el
      # job muere en catorce segundos con «Failed to resolve entry for package» y jamás llega a
      # simular una etapa. Y como este job SOLO corre cuando cambia el motor, llevaba roto justo en
      # los push en los que hace falta. Es la trampa que ya está escrita en `sim/invariants.test.ts`:
      # CI en verde mientras el simulador no se ha ejecutado.
      - name: Build del motor y sus dependencias
        if: steps.motor.outputs.correr == 'si'
        run: pnpm exec tsc -b packages/engine
      - name: Bancos
        if: steps.motor.outputs.correr == 'si'
        run: pnpm exec vitest run ${{ matrix.ficheros }}

  # LA PRUEBA DEL TELÉFONO (E3, docs/visual.md §7.4; PR 2a y 2b). «Si no se juega bien en un teléfono,
  # este documento no está terminado»: el encargo de E3 hace del teléfono un criterio de aceptación, y
  # este trabajo lo convierte en una prueba. Mide las diez comprobaciones de §7.1 en las 46 pantallas, a
  # 360 × 800 y 320 × 640 (`apps/web/e2e/telefono.spec.ts`), sobre el mundo de la prueba de la caché.
  #
  # EL TRINQUETE, CONTRA LA BASE Y SOBRE EL MISMO MUNDO (PR 2b; 7-h, generalizada). El mundo no sale igual
  # en dos construcciones del mismo código, y aquí se reconstruye cuando cambia su clave, cuando caduca su
  # caché y en cada push a `main`, que no ve la caché de los PR. Así que no se compara con las cifras de
  # `telefono-baseline.json`, medidas sobre otro mundo: en la misma ejecución se compila la web de la base
  # (un `worktree`), se sirve sobre el mismo mundo y se mide; el PR falla si una cifra sube sobre ella, o si
  # baja y `telefono-baseline.json` no lo apunta. Si la base no tiene ese fichero, el PR lo crea (el 2b).
  # Y si el PR toca el instrumento o cambia la clave del mundo (§7.4, regla 1; desde el 12b), puede
  # reescribirlo entero, y solo cuenta que nada suba.
  #
  # En `main` informa y no para (`continue-on-error`): el PR ya pasó el trinquete contra su base, y una
  # falta que solo saliera con los datos de otro mundo no puede dejar el commit en rojo, porque Railway no
  # redespliega un commit en rojo.
  #
  # Y SIN RED (PR 4; §12.1): tras la prueba, los casos de `apps/web/e2e/sinred.spec.ts` sobre el mismo
  # mundo y la web del PR (un trozo que no carga, la franja, lo pausado y la sesión que no llega), en
  # menos de un minuto. Corre aunque la prueba del teléfono falle, para ver las dos.
  #
  # Corre cuando cambia algo que se ve en el teléfono, con el mismo patrón que los bancos: el trabajo
  # existe siempre y lo que se salta es el trabajo de dentro. La web pinta lo que escribe `shared`, y el
  # motor construye el mundo de la prueba y lleva las palabras de la llegada (Ruso-020), así que los
  # cinco caminos son `apps/web`, `apps/api`, `packages/db`, `packages/shared` y `packages/engine`. Sin
  # base fiable con la que comparar, se corre.
  #
  # El coste (DD-16, aceptado por el dueño, con estas cifras medidas en el 2b): unos 15 minutos por PR con
  # el mundo de la caché, en paralelo con `Test`, y 7 más cuando hay que reconstruirlo (§7.2).
  telefono:
    name: Teléfono
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: ${{ github.event_name == 'push' }}
    env:
      FONTCONFIG_FILE: ${{ github.workspace }}/apps/web/e2e/fonts.conf
      E2E_BASE: http://localhost:3005
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: ¿Toca lo que se ve en el teléfono?
        id: toca
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo 'Sin base con la que comparar: se corre la prueba.'
            echo 'correr=si' >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE" "$HEAD" | grep -qE '^(apps/web/|apps/api/|packages/db/|packages/shared/|packages/engine/)'; then
            echo 'Cambia algo que se ve en el teléfono: se corre la prueba.'
            echo 'correr=si' >> "$GITHUB_OUTPUT"
          else
            echo 'No cambia nada que se vea en el teléfono: la prueba se salta.'
            echo 'correr=no' >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/setup
        if: steps.toca.outputs.correr == 'si'
      - name: Build
        if: steps.toca.outputs.correr == 'si'
        run: pnpm build
      - uses: ./.github/actions/telefono
        id: mundo
        if: steps.toca.outputs.correr == 'si'
      - name: La web de la base, sobre el mismo mundo
        id: base
        if: steps.toca.outputs.correr == 'si'
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE:apps/web/e2e/telefono-baseline.json" 2>/dev/null; then
            echo 'La base no tiene telefono-baseline.json: este PR lo crea y no hay con qué comparar.'
            echo 'hay=no' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git show "$BASE:apps/web/e2e/telefono-baseline.json" > "$RUNNER_TEMP/libro-base.json"
          if git diff --name-only "$BASE" HEAD -- apps/web/e2e/medidas.ts apps/web/e2e/navega.ts \
            apps/web/e2e/pantallas.ts apps/web/e2e/telefono.spec.ts apps/web/e2e/control.html | grep -q .; then
            echo 'El PR cambia el instrumento: puede reescribir telefono-baseline.json entero.'
            echo 'instrumento=cambia' >> "$GITHUB_OUTPUT"
          # LA CLAVE DEL MUNDO (§7.4, regla 1 de 7-h; PR 12b): las rutas de la clave de su caché
          # (`.github/actions/telefono/action.yml`), sin los tests. Un PR que la cambia se mide sobre un
          # mundo construido de nuevo, y una cifra en el borde (un recorte que sale con un nombre y no con
          # otro) puede ir en él al revés que en el mundo del fichero: con un 0 en el de la base y un 1 en
          # la web de la base, la bajada no se puede apuntar. Así que reescribe el fichero entero, como
          # dice §7.4, y solo cuenta que nada suba.
          elif git diff --name-only "$BASE" HEAD -- packages/db/drizzle packages/db/src packages/engine/src \
            packages/shared/src apps/web/e2e/world/build.mjs \
            | grep -vE '\.test\.ts$' | grep -qE '^packages/db/drizzle/|\.ts$|/build\.mjs$'; then
            echo 'El PR cambia la clave del mundo: puede reescribir telefono-baseline.json entero (§7.4, regla 1).'
            echo 'instrumento=cambia' >> "$GITHUB_OUTPUT"
          fi
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE"
          (cd "$RUNNER_TEMP/base" && pnpm install --frozen-lockfile --prefer-offline && pnpm --filter '@cyclingstar/web...' build)
          node apps/web/e2e/world/serve.mjs --port 3006 --web "$RUNNER_TEMP/base/apps/web/dist" > "$RUNNER_TEMP/serve-base.log" 2>&1 &
          for i in $(seq 1 90); do
            grep -q '^listening ' "$RUNNER_TEMP/serve-base.log" && break
            sleep 1
          done
          if ! grep -q '^listening ' "$RUNNER_TEMP/serve-base.log"; then
            cat "$RUNNER_TEMP/serve-base.log"
            exit 1
          fi
          echo 'hay=si' >> "$GITHUB_OUTPUT"
      - name: La medida de la base
        if: steps.base.outputs.hay == 'si'
        env:
          E2E_BASE: http://localhost:3006
          TELEFONO_LINEA_BASE: escribe
          TELEFONO_SALIDA: ${{ runner.temp }}/base.json
        run: |
          pnpm --filter @cyclingstar/web exec playwright test --project=telefono --output "$RUNNER_TEMP/resultados-base" \
            || echo '::warning::La medida de la base no salió entera: las pantallas que faltan no se comparan.'
      - name: La prueba del teléfono
        if: steps.toca.outputs.correr == 'si'
        env:
          TELEFONO_LINEA_BASE: ${{ steps.base.outputs.hay == 'si' && 'trinquete' || 'escribe' }}
          TELEFONO_REFERENCIA: ${{ runner.temp }}/base.json
          TELEFONO_LIBRO_BASE: ${{ runner.temp }}/libro-base.json
          TELEFONO_INSTRUMENTO: ${{ steps.base.outputs.instrumento }}
          TELEFONO_SALIDA: ${{ runner.temp }}/pr.json
        run: pnpm --filter @cyclingstar/web exec playwright test --project=telefono
      # Con su propia carpeta y sin el informe JSON: Playwright vacía la de salida al empezar, y el
      # informe es el de la prueba del teléfono.
      - name: Sin red
        if: ${{ !cancelled() && steps.mundo.outcome == 'success' }}
        run: |
          pnpm --filter @cyclingstar/web exec playwright test --project=sinred --reporter=list \
            --output "$RUNNER_TEMP/resultados-sinred"
      - name: Lo medido, de la base y del PR
        if: always() && steps.toca.outputs.correr == 'si'
        uses: actions/upload-artifact@v4
        with:
          name: telefono
          path: |
            ${{ runner.temp }}/base.json
            ${{ runner.temp }}/pr.json
            ${{ runner.temp }}/resultados-sinred/
            apps/web/e2e/.resultados/
          retention-days: 14
          if-no-files-found: ignore
          # `.resultados` empieza por punto, y sin esto `upload-artifact` la deja fuera
          include-hidden-files: true

  quality:
    name: Lint · Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Lint
        run: pnpm lint
      # Se ejecuta aunque el lint falle: son dos señales independientes y conviene verlas
      # las dos en la misma ejecución (`!cancelled()` en vez de `always()` para respetar
      # la cancelación por concurrencia).
      - name: Format check
        if: ${{ !cancelled() }}
        run: pnpm format

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm -r build
      # LOS PRESUPUESTOS DE PESO (E3, docs/visual.md §12.2; PR 6, D-50): la hoja que bloquea la primera
      # pintura, el JS de arranque y el sprite de las banderas, sobre la web recién compilada.
      - name: El peso de la web
        run: node --test apps/web/scripts/peso.test.mjs

  migrations:
    name: Migraciones (base vacía)
    runs-on: ubuntu-latest
    # Valida que el conjunto de migraciones de Drizzle aplica limpio sobre una base
    # recién creada, con el mismo camino que producción (advisory lock + citext), y que
    # una segunda pasada es idempotente (cada despliegue vuelve a llamar a runMigrations).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cyclingstar_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cyclingstar_migrations
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Build de packages/db
        run: pnpm exec tsc -b packages/db
      - name: Aplica las migraciones
        run: node scripts/migrate.mjs --verify-idempotent
# La AUDITORÍA de dependencias vivía aquí y se ha mudado a `cobertura.yml`: no bloqueaba el merge
