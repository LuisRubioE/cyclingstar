name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Jobs independientes y en paralelo: antes era un único job secuencial y un fallo de
  # typecheck ocultaba lint, format, tests y build. Ahora cada señal es independiente.
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    # Postgres disponible para los tests que lo necesiten (integración de packages/db).
    # Los tests que no lo usan (motor, shared) simplemente ignoran DATABASE_URL, así que
    # el job funciona tanto si la suite es 100% en memoria/pglite como si es real.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cyclingstar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cyclingstar_test
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # packages/db compilado: lo necesita el aplicador de migraciones (dist/migrate.js).
      - name: Build de packages/db
        run: pnpm exec tsc -b packages/db

      # Deja el esquema listo por si hay tests de integración contra DATABASE_URL.
      # Si aún no existen, este paso simplemente valida que las migraciones aplican.
      - name: Migraciones sobre la base de tests
        run: node scripts/migrate.mjs

      # SIN COBERTURA, y es una decisión de coste medida, no un descuido. Este job es el 87 % de lo
      # que cuesta el CI: de los 39 minutos facturables de un push, 34 son este, y dentro de él la
      # instrumentación de la cobertura multiplica la suite por 1,76 (medido en local: 530 s contra
      # 934 s sobre las mismas 1.249 pruebas). El repositorio es PRIVADO, así que esos minutos se
      # descuentan de la cuota de la cuenta, y el día que se agota no falla un test: se queda sin
      # arrancar el CI entero y con él el despliegue, que espera a la señal verde.
      #
      # La cobertura no se pierde: la mide `cobertura.yml` una vez al día, que es la cadencia a la
      # que se lee. Lo que se mira en CADA push es si la suite pasa, y eso es lo que sigue aquí.
      - name: Test
        run: pnpm test

  quality:
    name: Lint · Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Lint
        run: pnpm lint
      # Se ejecuta aunque el lint falle: son dos señales independientes y conviene verlas
      # las dos en la misma ejecución (`!cancelled()` en vez de `always()` para respetar
      # la cancelación por concurrencia).
      - name: Format check
        if: ${{ !cancelled() }}
        run: pnpm format

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm -r build

  migrations:
    name: Migraciones (base vacía)
    runs-on: ubuntu-latest
    # Valida que el conjunto de migraciones de Drizzle aplica limpio sobre una base
    # recién creada, con el mismo camino que producción (advisory lock + citext), y que
    # una segunda pasada es idempotente (cada despliegue vuelve a llamar a runMigrations).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cyclingstar_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cyclingstar_migrations
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Build de packages/db
        run: pnpm exec tsc -b packages/db
      - name: Aplica las migraciones
        run: node scripts/migrate.mjs --verify-idempotent
# La AUDITORÍA de dependencias vivía aquí y se ha mudado a `cobertura.yml`: no bloqueaba el merge
# (`continue-on-error`), nadie la miraba push a push, y una dependencia vulnerable no aparece por
# empujar código sino por pasar el tiempo. Es una señal DIARIA, no por commit.
